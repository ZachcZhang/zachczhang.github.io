{% assign visitor_map_url = site.visitor_stats.mapmyvisitors_script_url | default: "" | strip %}
{% if site.visitor_stats.enabled and visitor_map_url != "" %}
<div class="page__visitors">
  <div class="page__visitors-map">
    <script type="text/javascript" id="mapmyvisitors" src="{{ visitor_map_url | escape }}"></script>
    <noscript>Enable JavaScript to view the visitor map.</noscript>
  </div>
</div>
{% endif %}
